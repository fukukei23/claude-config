[project]
name = "glm-rate-proxy"
version = "0.1.0"
description = "Transparent rate-limiting proxy for Claude Code → ZAI API with automatic model fallback"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["src"]
