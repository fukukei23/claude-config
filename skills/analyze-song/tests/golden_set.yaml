# ゴールドセット — analyze-song Phase3 照合エンジンの回帰指標（spec 3.2 推奨3例）
# chord 指標見直し（2026-06-24）で 3 指標（n-gram Jaccard / 度和音頻度コサイン /
# 機能和声×クオリティコサイン）× 重み調整（chord 最重視 0.70 まで）の全組合せを検証したが
# 3ペアとも spec 期待を満たさない。根本原因は DB選曲と和音分布のミスマッチ
# （JPOP-001 Lemon=短調は期待曲 JPOP-002 より HIPHOP-005 の方が和音近い）。
# → データ/評価設計の限界・指標の問題ではない。選曲見直しは別 P1。テストは xfail。
k: 5
pairs:
  - query_id: JPOP-001          # Lemon
    type: exact_song
    expected_song_id: JPOP-002  # ドライフラワー（同系JPOPバラード）
    note: 同系JPOPバラードが上位に来るべき
  - query_id: ROCK-006          # Bohemian Rhapsody
    type: genre_affinity
    expected_genre: ROCK
    min_count: 3                # 上位5件中 ROCK が >=3
    note: 他ROCKが上位・構造的特徴で混ざることを許容
  - query_id: HIPHOP-004        # HUMBLE.
    type: genre_affinity
    expected_genre: HIPHOP
    min_count: 3
    note: 他HIPHOPが上位
