# ゴールドセット — analyze-song Phase3 照合エンジンの回帰指標（spec 3.2 推奨3例）
# progression正規化（2026-06-24）で chord 軸はクリーンな三和音ラベル化・スコア実効値化したが、
# n-gram Jaccard 指標では同/異ジャンルで chord スコアに有意差なくジャンル判別不可。
# 3ペアとも spec 期待を満たさない → テストは xfail。
# chord 指標見直し（度和音頻度分布のコサイン類似度等・別タスク）後に green 化予定。
k: 5
pairs:
  - query_id: JPOP-001          # Lemon
    type: exact_song
    expected_song_id: JPOP-002  # ドライフラワー（同系JPOPバラード）
    note: 同系JPOPバラードが上位に来るべき
  - query_id: ROCK-006          # Bohemian Rhapsody
    type: genre_affinity
    expected_genre: ROCK
    min_count: 3                # 上位5件中 ROCK が >=3
    note: 他ROCKが上位・構造的特徴で混ざることを許容
  - query_id: HIPHOP-004        # HUMBLE.
    type: genre_affinity
    expected_genre: HIPHOP
    min_count: 3
    note: 他HIPHOPが上位
